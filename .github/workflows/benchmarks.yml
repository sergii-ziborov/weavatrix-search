name: Benchmarks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - benches/**
      - src/**
      - Cargo.toml
      - Cargo.lock
      - README.md

permissions:
  contents: read

jobs:
  ripgrep-parity:
    name: ripgrep parity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install ripgrep 15.2.0
        run: cargo +stable install ripgrep --version 15.2.0 --locked
      - name: Verify ripgrep
        run: rg --version
      - name: Run output-equivalent benchmark
        env:
          WEAVATRIX_SEARCH_BENCH_RUNS: 5
          WEAVATRIX_SEARCH_BENCH_WARMUPS: 1
        run: cargo +stable bench --bench compare_ripgrep
      - name: Prepare persistent-index corpus
        run: cargo +stable bench --bench compare_ripgrep -- prepare "${{ runner.temp }}/weavatrix-search-index-bench" 6000
      - name: Run persistent/live index benchmark
        env:
          WEAVATRIX_SEARCH_BENCH_RUNS: 5
          WEAVATRIX_SEARCH_BENCH_WARMUPS: 1
        run: cargo +stable bench --bench compare_ripgrep -- run-index "${{ runner.temp }}/weavatrix-search-index-bench"
      - name: Prepare 200k scale corpus
        if: runner.os == 'Linux'
        run: cargo +stable bench --bench compare_ripgrep -- prepare "${{ runner.temp }}/weavatrix-search-scale-bench" 200000
      - name: Run 200k exact literal benchmark
        if: runner.os == 'Linux'
        env:
          WEAVATRIX_SEARCH_BENCH_RUNS: 3
          WEAVATRIX_SEARCH_BENCH_WARMUPS: 1
        run: cargo +stable bench --bench compare_ripgrep -- run-literal "${{ runner.temp }}/weavatrix-search-scale-bench"
