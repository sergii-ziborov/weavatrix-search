name: Publish crate

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - Cargo.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-crate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Verify release identity
        shell: bash
        run: |
          VERSION="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" == "v$VERSION" ]] || { echo "Tag $GITHUB_REF_NAME does not match crate version $VERSION" >&2; exit 1; }
          else
            [[ "$GITHUB_REF_NAME" == "main" ]] || { echo "Version releases may only run from main" >&2; exit 1; }
          fi
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Run Clippy
        run: cargo +stable clippy --all-targets --all-features --locked -- -D warnings
      - name: Run tests
        run: cargo +stable test --all-features --locked
      - name: Verify package
        run: cargo +stable publish --locked --dry-run
      - name: Check whether this immutable version already exists
        id: registry
        shell: bash
        run: |
          VERSION="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if curl --fail --silent --show-error \
            --user-agent "weavatrix-release-verifier/1.0 (https://github.com/sergii-ziborov/weavatrix-search)" \
            "https://crates.io/api/v1/crates/weavatrix-search/$VERSION" |
            jq -e --arg version "$VERSION" '.version.num == $version' >/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate with crates.io trusted publishing
        if: steps.registry.outputs.published != 'true'
        id: crates-io
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish with a short-lived OIDC token
        if: steps.registry.outputs.published != 'true' && steps.crates-io.outcome == 'success'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}
        run: cargo +stable publish --locked --no-verify
      - name: Publish with the repository bootstrap token
        if: steps.registry.outputs.published != 'true' && steps.crates-io.outcome != 'success'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          [[ -n "$CARGO_REGISTRY_TOKEN" ]] || { echo "Configure crates.io trusted publishing or CARGO_REGISTRY_TOKEN" >&2; exit 1; }
          cargo +stable publish --locked --no-verify
          echo "::warning::Configure this repository as a crates.io trusted publisher, then remove CARGO_REGISTRY_TOKEN."
      - name: Verify immutable crates.io artifact
        shell: bash
        run: |
          VERSION="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')"
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error \
              --user-agent "weavatrix-release-verifier/1.0 (https://github.com/sergii-ziborov/weavatrix-search)" \
              "https://crates.io/api/v1/crates/weavatrix-search/$VERSION" |
              jq -e --arg version "$VERSION" '.version.num == $version' >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "weavatrix-search@$VERSION did not become visible on crates.io" >&2
          exit 1
      - name: Create immutable GitHub release
        if: steps.registry.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes --title "$TAG"
          fi
